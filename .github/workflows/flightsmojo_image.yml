# FlightsMojo-branded Chatwoot CE image.
# Mirrors upstream publish_foss_docker.yml: strips enterprise/ (CE-only
# image, no EE code ships) and builds docker/Dockerfile. Publishes to GHCR
# under this fork's owner.
#
# Tags: a git tag like v4.18.0-fm2 publishes an image with that exact tag —
# the thing the compose file pins — and it is never rebuilt, so a pin always
# means the same code. Pushes to the flightsmojo branch only refresh the
# moving flightsmojo-latest tag. Release = merge to flightsmojo, then
#   git tag v4.18.0-fm2 && git push origin v4.18.0-fm2

name: Build FlightsMojo Chatwoot image

on:
  push:
    branches:
      - flightsmojo
    tags:
      - 'v*-fm*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mishraadityan09/chatwoot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code (CE build, as upstream does)
        run: |
          rm -rf enterprise spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Decide image tags
        id: tags
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:flightsmojo-latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:flightsmojo-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
