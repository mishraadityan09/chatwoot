# FlightsMojo-branded Chatwoot CE image.
# Mirrors upstream publish_foss_docker.yml: strips enterprise/ (CE-only
# image, no EE code ships) and builds docker/Dockerfile. Publishes to GHCR
# under this fork's owner. Triggered on pushes to the flightsmojo branch.

name: Build FlightsMojo Chatwoot image

on:
  push:
    branches:
      - flightsmojo
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mishraadityan09/chatwoot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code (CE build, as upstream does)
        run: |
          rm -rf enterprise spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:v4.18.0-fm2
            ${{ env.IMAGE }}:flightsmojo-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
